<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #1b2a4a;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    position: fixed; inset: 0;
  }
  canvas#game { display: block; position: absolute; left: 0; top: 0; touch-action: none; }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: linear-gradient(#3fb6ff, #8de0ff);
    color: #fff; font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    text-align: center; flex-direction: column; align-items: center; justify-content: center;
    text-shadow: 0 3px 0 #1b4a7a;
  }
  #rotate .phone {
    width: 70px; height: 120px; border: 6px solid #fff; border-radius: 14px;
    margin-bottom: 28px; box-shadow: 0 4px 0 #1b4a7a;
    animation: turn 2s ease-in-out infinite;
  }
  #rotate h1 { font-size: 30px; margin: 0 20px 10px; }
  #rotate p { font-size: 18px; margin: 0 30px; }
  @keyframes turn { 0%,25% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
  }
  body.force-rotate #rotate { display: flex; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">
  <div class="phone"></div>
  <h1>Turn your phone sideways</h1>
  <p>Run N Rumble plays in landscape mode.</p>
</div>
<script src="js/analytics.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/draw.js"></script>
<script src="js/art.js"></script>
<script src="js/friends.js"></script>
<script src="js/art2.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
